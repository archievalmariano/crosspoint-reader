# Builds a suite release candidate: exactly the release, from exactly this commit.
#
# Dispatch it on a branch named release/v{apps_version}[-...], e.g.
# release/v1.1.1-clean for `apps_version = 1.1.1`. Each release env is built
# cold with the same pinned tooling as before, and the `release-candidate`
# artifact holds:
#   the 18 release files     firmware-x4-{g,gd}.bin, firmware-x4pro-{g,gd,p,pd,gp,gpd}.bin
#                            and their .factory.bin, plus the legacy firmware.bin
#                            and firmware-x4pro.bin copies for devices on 1.0.1,
#                            e3-host-evidence.json and post-launch-host-evidence.json (below)
#   SHA256SUMS.txt           over those 18 files
#   provenance.json          commit, ref, run id/attempt, workflow ref, digests
# and `x4pro-flash-support` (never published) holds the X4 Pro USB pieces
# (bootloader.bin, partitions.bin, boot_app0.bin) of each X4 Pro build. The run
# fails unless every build passes and every .factory.bin is exactly its pieces.
#
# Physical E3 is not a release gate. Host E3 coverage is mandatory: the
# e3-host-tests job runs every host test on this run's own commit, and
# e3-host-evidence.json records that each required E3 test (acceptance-v1.json
# hostCovered) ran and passed, none skipped. assemble refuses a candidate
# without it, and the acceptance record must carry the same evidence. From the
# same report, post-launch-host-evidence.json records the same for the host
# tests that replace the two production-503 physical checks under post-launch
# maintenance acceptance (acceptance-maintenance-v1.json hostCovered); every
# candidate carries it, and only a maintenance record relies on it.
#
# These bytes are what gets installed and physically accepted; release.yml
# later publishes this same artifact, never a rebuild (builds embed their build
# time, so no rebuild could match). See docs/RELEASING.md.
name: Compile Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Check branch matches apps_version
    if: startsWith(github.ref_name, 'release/')
    runs-on: ubuntu-latest
    outputs:
      display: ${{ steps.check.outputs.display }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        run: |
          set -euo pipefail
          apps=$(python3 -c "import configparser; c=configparser.ConfigParser(); c.read('platformio.ini'); print(c.get('crosspoint','apps_version'))")
          base=$(python3 -c "import configparser; c=configparser.ConfigParser(); c.read('platformio.ini'); print(c.get('crosspoint','version'))")
          case "${GITHUB_REF_NAME}" in
            "release/v${apps}" | "release/v${apps}-"*) ;;
            *) echo "::error::Branch ${GITHUB_REF_NAME} is not release/v${apps}[-...]"; exit 1 ;;
          esac
          echo "display=${base}-A${apps}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
      - name: Release and package-letter tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/release
          python3 -m unittest scripts/test_git_branch.py

  build:
    name: Build ${{ matrix.env }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - env: gh_release
            package: G
          - env: x4-goto-dogear-gh_release
            package: GD
          - env: x4pro-goto-gh_release
            package: G
            factory: true
          - env: x4pro-goto-dogear-gh_release
            package: GD
            factory: true
          - env: x4pro-onpoint-gh_release
            package: P
            factory: true
          - env: x4pro-onpoint-dogear-gh_release
            package: PD
            factory: true
          - env: x4pro-gh_release
            package: GP
            factory: true
          - env: x4pro-all-gh_release
            package: GPD
            factory: true
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.18"
          enable-cache: false
      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"
      - name: Build ${{ matrix.env }} firmware
        run: |
          set -euo pipefail
          pio run -e ${{ matrix.env }} | tee pio.log
          grep -q "CrossPoint build version: ${{ needs.version.outputs.display }}-${{ matrix.package }}$" pio.log
      - name: Collect build outputs
        run: |
          set -euo pipefail
          b=.pio/build/${{ matrix.env }}
          out=build-${{ matrix.env }}
          mkdir -p "$out"
          cp "$b/firmware.bin" "$out/"
          sed -n 's/^CrossPoint build version: //p' pio.log | tail -n 1 > "$out/version.txt"
          if [ "${{ matrix.factory }}" = "true" ]; then
            cp "$b/firmware.factory.bin" "$b/bootloader.bin" "$b/partitions.bin" "$out/"
            # The otadata image merged at 0xe000; assemble checks it is exactly that slice.
            cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin "$out/"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.env }}
          path: build-${{ matrix.env }}/
          if-no-files-found: error
          retention-days: 7

  e3-host-tests:
    # The required E3 host tests, on exactly this run's commit (never another
    # run, ref or trigger): every host test must pass, and e3-evidence fails
    # unless each required E3 test ran once and passed, none skipped.
    name: E3 host tests (this commit)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
      - name: Install the DOGEAR TLS test certificate generator (hash-pinned)
        run: |
          python3 -m venv /tmp/dogear-certs
          /tmp/dogear-certs/bin/pip install --require-hashes -r test/dogear_tls/requirements.txt
      - name: Configure
        # The DOGEAR TLS tests must run here: a missing dependency fails the configure step.
        run: >-
          cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DDOGEAR_REQUIRE_TLS_TESTS=ON -DDOGEAR_CERTS_PYTHON=/tmp/dogear-certs/bin/python
      - name: Build
        run: cmake --build build/test
      - name: Run every host test, with a JUnit report
        run: ctest --test-dir build/test --output-on-failure -j --output-junit "${GITHUB_WORKSPACE}/ctest-junit.xml"
      - name: E3 host evidence
        run: |
          set -euo pipefail
          mkdir e3
          python3 scripts/release/candidate.py e3-evidence --junit ctest-junit.xml \
            --repository "${GITHUB_REPOSITORY}" --commit "${GITHUB_SHA}" --run-id "${GITHUB_RUN_ID}" \
            --out e3/e3-host-evidence.json
      - name: Post-launch host evidence
        run: |
          set -euo pipefail
          python3 scripts/release/candidate.py post-launch-evidence --junit ctest-junit.xml \
            --repository "${GITHUB_REPOSITORY}" --commit "${GITHUB_SHA}" --run-id "${GITHUB_RUN_ID}" \
            --out e3/post-launch-host-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: e3-host-evidence
          path: e3/
          if-no-files-found: error
          retention-days: 90

  assemble:
    name: Assemble release candidate
    needs: [version, build, e3-host-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: builds
      - uses: actions/download-artifact@v4
        with:
          name: e3-host-evidence
          path: e3
      - name: Assemble and verify
        run: |
          set -euo pipefail
          python3 scripts/release/candidate.py assemble --builds builds --out candidate --support support \
            --display "${{ needs.version.outputs.display }}" --commit "${GITHUB_SHA}" --ref "${GITHUB_REF_NAME}" \
            --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --workflow-ref "${GITHUB_WORKFLOW_REF}" --repository "${GITHUB_REPOSITORY}" \
            --e3-evidence e3/e3-host-evidence.json --post-launch-evidence e3/post-launch-host-evidence.json
          python3 scripts/release/candidate.py verify-dir candidate --support support \
            --commit "${GITHUB_SHA}" --run-id "${GITHUB_RUN_ID}"
          {
            echo "### Release candidate ${{ needs.version.outputs.display }}"
            echo "commit \`${GITHUB_SHA}\`, run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            echo "SHA256SUMS.txt sha256: \`$(sha256sum candidate/SHA256SUMS.txt | cut -d' ' -f1)\`"
            echo "E3 host evidence (every required E3 host test PASS, none skipped): \`$(sha256sum candidate/e3-host-evidence.json | cut -d' ' -f1)\`"
            echo "Post-launch host evidence (every required post-launch host test PASS, none skipped): \`$(sha256sum candidate/post-launch-host-evidence.json | cut -d' ' -f1)\`"
            echo '```'
            cat candidate/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: x4pro-flash-support
          path: support/
          if-no-files-found: error
          retention-days: 90
