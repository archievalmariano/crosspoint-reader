# Promotes a physically accepted release candidate to a DRAFT release when its
# version tag is pushed. Nothing is built here: the published files are the
# candidate's own bytes (see release_candidate.yml and docs/RELEASING.md).
#
# Tag format: an ANNOTATED tag v{apps_version} on the candidate's commit, whose
# message carries the acceptance record:
#   candidate-run: <run id of release_candidate.yml>
#   candidate-sums-sha256: <sha256 of that run's SHA256SUMS.txt>
#   physically-accepted: x4-g x4pro-g x4pro-p x4pro-gp
# The job stops, creating nothing, unless the tag matches apps_version, the run
# is this repository's release_candidate.yml dispatched on release/v{apps_version}
# at exactly the tagged commit and succeeded, every package was physically
# accepted, and the downloaded artifact matches the accepted digest. The draft
# is then checked asset by asset against GitHub's own digests. Publishing it
# and marking it latest happen only through `scripts/release/candidate.py
# publish`, which checks release immutability and everything above first.
#
# The update check downloads firmware-<board>-<package>.bin from the latest
# release (src/network/OtaAsset.h), so a device stays on the package it runs;
# firmware.bin and firmware-x4pro.bin carry 1.0.1 devices to x4-g and x4pro-gp.
name: Publish Release Draft

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  promote:
    name: Promote the accepted candidate
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the draft release
      actions: read    # read the candidate run and download its artifact
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
      - name: Check the tag, the candidate run and the acceptance record
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apps=$(python3 -c "import configparser; c=configparser.ConfigParser(); c.read('platformio.ini'); print(c.get('crosspoint','apps_version'))")
          base=$(python3 -c "import configparser; c=configparser.ConfigParser(); c.read('platformio.ini'); print(c.get('crosspoint','version'))")
          if [ "${GITHUB_REF_NAME}" != "v${apps}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match apps_version ${apps} (expected v${apps})"
            exit 1
          fi
          ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")
          if [ "$(jq -r .object.type <<<"$ref")" != "tag" ]; then
            echo "::error::${GITHUB_REF_NAME} is a lightweight tag; the acceptance record needs an annotated tag"
            exit 1
          fi
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$(jq -r .object.sha <<<"$ref")")
          if [ "$(jq -r .object.type <<<"$tag")" != "commit" ] || [ "$(jq -r .object.sha <<<"$tag")" != "${GITHUB_SHA}" ]; then
            echo "::error::${GITHUB_REF_NAME} does not point directly at ${GITHUB_SHA}"
            exit 1
          fi
          jq -r .message <<<"$tag" > tag-message.txt
          python3 scripts/release/candidate.py parse-tag tag-message.txt > fields.txt
          cat fields.txt >> "$GITHUB_OUTPUT"
          run_id=$(sed -n 's/^candidate_run=//p' fields.txt)
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > run.json
          workflow_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release_candidate.yml" --jq .id)
          python3 scripts/release/candidate.py check-run run.json --repository "${GITHUB_REPOSITORY}" \
            --workflow-id "${workflow_id}" --commit "${GITHUB_SHA}" --branch-prefix "release/v${apps}"
          echo "display=${base}-A${apps}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          run-id: ${{ steps.check.outputs.candidate_run }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify the accepted bytes
        env:
          RUN_ID: ${{ steps.check.outputs.candidate_run }}
          SUMS_SHA256: ${{ steps.check.outputs.candidate_sums_sha256 }}
        run: |
          python3 scripts/release/candidate.py verify-dir candidate \
            --sums-sha256 "${SUMS_SHA256}" --commit "${GITHUB_SHA}" --run-id "${RUN_ID}"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          DISPLAY_VERSION: ${{ steps.check.outputs.display }}
          RUN_ID: ${{ steps.check.outputs.candidate_run }}
        run: |
          set -euo pipefail
          mkdir publish
          cp candidate/*.bin candidate/SHA256SUMS.txt publish/
          cat > notes.md <<EOF
          Firmware ${DISPLAY_VERSION} (CrossPoint base + APPS ${GITHUB_REF_NAME#v}), in app packages.
          Every package opens its apps from Home > Apps.

          | Package | XTEINK X4 (microSD) | XTEINK X4 Pro (USB, flash at \`0x0\`) |
          |---|---|---|
          | GOTO | \`firmware-x4-g.bin\` | \`firmware-x4pro-g.factory.bin\` |
          | ON POINT | not available (needs a real-time clock) | \`firmware-x4pro-p.factory.bin\` |
          | GOTO + ON POINT | not available | \`firmware-x4pro-gp.factory.bin\` |

          - **Over Wi-Fi:** Settings > System > Check for updates keeps a device on its current package.
          - **X4 (microSD):** copy the file to the card and use Settings > System > SD Card Firmware Update.
          - \`firmware.bin\` and \`firmware-x4pro.bin\` are for devices updating from 1.0.1.

          Checksums are in \`SHA256SUMS.txt\`. These are the files built by release-candidate run
          ${RUN_ID} from ${GITHUB_SHA} and accepted on device before publication.
          EOF
          gh release create "${GITHUB_REF_NAME}" publish/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "CrossPoint ${DISPLAY_VERSION}" \
            --notes-file notes.md \
            --draft \
            --verify-tag
      - name: Check the draft against the accepted bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\" and .draft)" > release.json
          python3 scripts/release/candidate.py verify-release release.json \
            --sums candidate/SHA256SUMS.txt --tag "${GITHUB_REF_NAME}" --state draft
