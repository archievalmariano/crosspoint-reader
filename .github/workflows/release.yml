# Publishes a suite firmware release when a version tag is pushed.
#
# Tag format: v{apps_version}, e.g. v1.0.1 for `apps_version = 1.0.1` in
# platformio.ini. The tag must match apps_version exactly; the on-device update
# check compares the latest release tag against the running apps_version.
#
# Assets the update check downloads (names are fixed by OtaUpdater):
#   firmware.bin        X4 (ESP32-C3) app image, from gh_release
#   firmware-x4pro.bin  X4 Pro (ESP32-S3) app image, from x4pro-gh_release
# Also attached for USB installs: firmware-x4pro.factory.bin (flash at 0x0).
#
# Builds are cold (no PlatformIO cache) with the same pinned tooling as the
# Suite production build workflow.
name: Compile Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  version:
    name: Check tag matches apps_version
    runs-on: ubuntu-latest
    outputs:
      display: ${{ steps.check.outputs.display }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        run: |
          set -euo pipefail
          apps=$(python3 -c "import configparser; c=configparser.ConfigParser(); c.read('platformio.ini'); print(c.get('crosspoint','apps_version'))")
          base=$(python3 -c "import configparser; c=configparser.ConfigParser(); c.read('platformio.ini'); print(c.get('crosspoint','version'))")
          if [ "${GITHUB_REF_NAME}" != "v${apps}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match apps_version ${apps} (expected v${apps})"
            exit 1
          fi
          echo "display=${base}-A${apps}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.env }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - env: gh_release        # X4 / X3 (ESP32-C3)
            asset: firmware.bin
          - env: x4pro-gh_release  # X4 Pro (ESP32-S3)
            asset: firmware-x4pro.bin
            factory: firmware-x4pro.factory.bin
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.18"
          enable-cache: false
      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"
      - name: Build ${{ matrix.env }} firmware
        run: |
          set -euo pipefail
          pio run -e ${{ matrix.env }} | tee pio.log
          grep -q "CrossPoint build version: ${{ needs.version.outputs.display }}" pio.log
      - name: Name release assets
        run: |
          set -euo pipefail
          mkdir -p out
          cp .pio/build/${{ matrix.env }}/firmware.bin out/${{ matrix.asset }}
          if [ -n "${{ matrix.factory }}" ]; then
            cp .pio/build/${{ matrix.env }}/firmware.factory.bin out/${{ matrix.factory }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.env }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: out
      - name: Checksums
        run: cd out && sha256sum * | tee SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          DISPLAY_VERSION: ${{ needs.version.outputs.display }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          Firmware ${DISPLAY_VERSION} (CrossPoint base + APPS ${GITHUB_REF_NAME#v}).

          - **Over Wi-Fi:** Settings > System > Check for updates on the device.
          - **X4 (SD card):** copy \`firmware.bin\` to the card and use Settings > System > SD Card Firmware Update.
          - **X4 Pro (USB):** flash \`firmware-x4pro.factory.bin\` at \`0x0\`.

          Checksums are in \`SHA256SUMS.txt\`.
          EOF
          gh release create "${GITHUB_REF_NAME}" out/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "CrossPoint ${DISPLAY_VERSION}" \
            --notes-file notes.md \
            --latest
